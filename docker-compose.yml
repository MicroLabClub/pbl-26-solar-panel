# Production / deploy compose.
#
# Single public entrypoint: the `web` (nginx) container, bound to
# 127.0.0.1:9006 as required by the microlab.club host. nginx serves the
# SPA and reverse-proxies /api/* to the api container over the internal
# docker network. mongodb and api are NOT published — they talk over the
# compose network by service name.
#
# For local development with direct ports + Swagger + mongo-express, layer
# the dev override on top:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build

services:
  mongodb:
    image: mongo:7
    container_name: solar-mongo
    restart: unless-stopped
    # Cap WiredTiger cache so Mongo stays within mem_limit on the shared,
    # no-swap host (otherwise it sizes the cache to host RAM and gets OOM-killed).
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    environment:
      # Root admin user — created by the official image on first startup.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      # Database the init script creates the app user against.
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      # Consumed by /docker-entrypoint-initdb.d/init.js
      MONGO_APP_USERNAME: ${MONGO_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend/SolarMonitoring.API
    container_name: solar-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Override the mock connection string baked into appsettings.json.
      MongoDb__ConnectionString: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE}
      MongoDb__DatabaseName: ${MONGO_DATABASE}
      # MQTT broker — fill these in .env for live telemetry ingestion.
      Mqtt__Host: ${Mqtt__Host:-}
      Mqtt__Port: ${Mqtt__Port:-8883}
      Mqtt__UseTls: ${Mqtt__UseTls:-true}
      Mqtt__Username: ${Mqtt__Username:-}
      Mqtt__Password: ${Mqtt__Password:-}
      # Distinct per environment so a local container doesn't clash with prod
      # on the broker (duplicate client ids cause connection flapping).
      Mqtt__ClientId: ${Mqtt__ClientId:-solar-monitoring-api}
      Mqtt__Topic: ${Mqtt__Topic:-solar/+/telemetry}
      Mqtt__PersistCron: ${Mqtt__PersistCron:-0 * * * * ?}
    depends_on:
      mongodb:
        condition: service_healthy
    mem_limit: 512m

  web:
    build:
      context: ./frontend
    container_name: solar-web
    restart: unless-stopped
    # REQUIRED by the host: bind to 127.0.0.1:9006 only. Not 9006, not 0.0.0.0.
    ports:
      - "127.0.0.1:9006:80"
    depends_on:
      - api
    mem_limit: 128m

volumes:
  mongo_data:
