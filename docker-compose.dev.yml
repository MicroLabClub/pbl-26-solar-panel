# Local development override. Layer on top of the production compose:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# Re-publishes service ports to the host and adds mongo-express. NEVER use
# this file on the shared deploy host — it exposes internal services.

services:
  mongodb:
    ports:
      - "${MONGO_PORT:-27017}:27017"

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "${API_PORT:-5050}:8080"

  web:
    ports:
      - "${WEB_PORT:-8080}:80"

  mongo-express:
    image: mongo-express:1.0.2
    container_name: solar-mongo-express
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
